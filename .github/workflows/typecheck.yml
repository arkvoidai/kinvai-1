name: Production type, build, and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, production build, and Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm test
